name: CI - Testes Java

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Testes unitarios com Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar e executar testes
        run: mvn --batch-mode --no-transfer-progress -DfailIfNoTests=true clean verify